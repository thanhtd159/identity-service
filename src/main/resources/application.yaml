server:
  port: 8080
  servlet:
    context-path: /identity

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:mysql://localhost:3306/identity_service?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      maximum-pool-size: 20
      minimum-idle: 5

  # ========================= JPA & Hibernate =========================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        hbm2ddl.auto: update
    open-in-view: false

  # ========================= Logging =========================
  logging:
    level:
      root: INFO
      org.springframework.web: DEBUG
      com.devspring.identityservice: DEBUG
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} %5p [${spring.application.name},%X{traceId:-},%X{spanId:-}] %c{1.5} - %msg%n"

  # ========================= Security =========================
  security:
    user:
      password: [PASSWORD]

  # ========================= Mail (for verification) =========================
  mail:
    host: smtp.gmail.com
    port: 587
    username: [EMAIL_ADDRESS]
    password: [PASSWORD]
    properties:
      mail.smtp.auth: "true"
      mail.smtp.starttls.enable: "true"
      mail.smtp.starttls.required: "true"

# ========================= Custom Configuration =========================
app:
  security:
    jwt:
      secretKey: "6BBAD7B1865CBED5F1E58E4D457276A69ECFF178CDD1DF1EC8BF705AE96C65AB"
      expiration-seconds: 86400
      refresh-token-expiration-seconds: 604800
    verification:
      token-expiration-minutes: 15
      email-resend-cooldown-minutes: 5
    resend-limit:
      ip: 5
      email: 3
    rate-limit:
      window-minutes: 15
      max-requests: 100
  server:
    port: 8080
    timeout:
      connection: 15000
      read: 30000
      write: 30000
  email:
    from: [EMAIL_ADDRESS]
    subject-prefix: "[DevSpring Identity]"
